services:
  - type: web
    name: ppt-lesson-plan-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: VISION_MODEL
        value: gpt-5.6
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: OPENAI_WRITER_MODEL
        value: gpt-5.6
      - key: MAX_PPT_MB
        value: "45"
      - key: MAX_DOCX_MB
        value: "15"
